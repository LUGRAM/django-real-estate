services:

  # Base de données
  postgres-db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

  #  Cache / Message broker 
  redis:
    image: redis:7-alpine
    networks:
      - backend-network
    restart: unless-stopped

  # API Django 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    volumes:
      - ./backend:/app
      - logs_data:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - postgres-db
      - redis
    networks:
      - backend-network
      - app-network
    restart: unless-stopped

  # Worker Celery 
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A real_estate worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - postgres-db
    networks:
      - backend-network
    restart: unless-stopped

  # Frontend Next.js 
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - node_modules_frontend:/app/node_modules
    ports:
      - "3001:3000"
    networks:
      - app-network
    restart: unless-stopped

  # Reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

# Réseaux
networks:
  backend-network:
    driver: bridge
  app-network:
    driver: bridge

# Volumes nommés
volumes:
  postgres_data:
  logs_data:
  node_modules_frontend:
