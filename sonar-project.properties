# ── Identifiants SonarCloud ────────────────────────────────────────────────────
# Ces valeurs doivent correspondre exactement à ce que tu as créé sur sonarcloud.io
sonar.organization=LUGRAM
sonar.projectKey=LUGRAM_django-real-estate
sonar.projectName=django-real-estate

# ── Sources analysées ──────────────────────────────────────────────────────────
sonar.sources=backend,client/app,client/components,client/lib,client/hooks

# ── Couverture Python (générée par pytest-cov) ────────────────────────────────
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.13

# ── Exclusions ─────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/staticfiles/**,\
  **/mediafiles/**,\
  **/vendor-chunks/**

# ── Marquage des fichiers de tests (dans sonar.sources) ───────────────────────
sonar.test.inclusions=**/test_*.py,**/tests.py,**/tests/**/*.py

# ── Encodage ───────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
