name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:

  # ── Job 1 : Tests Django + couverture ──────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin12345
          POSTGRES_DB: estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: real_estate.settings.development
      SECRET_KEY: test-ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost 127.0.0.1"
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin12345
      POSTGRES_DB: estate
      PG_HOST: localhost
      PG_PORT: "5432"
      SIGNING_KEY: test-signing-key
      EMAIL_HOST: localhost
      EMAIL_HOST_USER: test
      EMAIL_HOST_PASSWORD: test
      EMAIL_PORT: "25"
      DOMAIN: localhost:8000
      CELERY_BROKER: redis://localhost:6379/0
      CELERY_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create logs directory
        run: mkdir -p backend/logs && touch backend/logs/real_estate.log

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          pytest \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-config=setup.cfg \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 1

  # ── Job 2 : Lint Next.js ────────────────────────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Lint
        working-directory: ./client
        run: npm run lint

  # ── Job 3 : SonarCloud ─────────────────────────────────────────────────────
  sonarcloud:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e  # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── Job SAST : CodeQL Security Analysis ───────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── Job 4 : Build -> Trivy -> Push Docker Hub ────────────────────────────────
  build-and-push:
    needs: [sonarcloud, sast]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Backend : build ────────────────────────────────────────────────────
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          push: false
          tags: lugram/django-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Backend : Trivy scan ───────────────────────────────────────────────
      - name: Security scan (Trivy) — backend
        uses: aquasecurity/trivy-action@v0.36.0        
        with:
          image-ref: lugram/django-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # ── Backend : push ─────────────────────────────────────────────────────
      - name: Push backend image
        run: |
          docker tag lugram/django-backend:${{ github.sha }} lugram/django-backend:latest
          docker push lugram/django-backend:latest
          docker push lugram/django-backend:${{ github.sha }}

      # ── Frontend : build ───────────────────────────────────────────────────
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # la v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          load: true
          push: false
          tags: lugram/nextjs-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend : Trivy scan ──────────────────────────────────────────────
      - name: Security scan (Trivy) — frontend
        uses: aquasecurity/trivy-action@v0.36.0        # la version stable de trivy
        with:
          image-ref: lugram/nextjs-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # ── Frontend : push ────────────────────────────────────────────────────
      - name: Push frontend image
        run: |
          docker tag lugram/nextjs-frontend:${{ github.sha }} lugram/nextjs-frontend:latest
          docker push lugram/nextjs-frontend:latest
          docker push lugram/nextjs-frontend:${{ github.sha }}
